#:schema https://mise.jdx.dev/schema/mise.json

[tasks]
  [tasks.dev]
  depends = [ "sync" ]
  run = "vite dev --port 3000"

  [tasks.preview]
  description = "Preview the production build on the local workerd runtime"
  depends = [ "build" ]
  run = "vite preview --port 3000"

  [tasks.build]
  depends = [ "sync" ]
  run = "vite build"
  env = { NODE_ENV = "production" }

  [tasks.deploy]
  description = "Deploy the build output to Cloudflare Workers (production)"
  run = "vinext-cloudflare deploy --skip-build"

  [tasks.upload]
  description = "Upload the build output to Cloudflare Workers as a preview version without deploying it to production"
  run = "vinext-cloudflare deploy --skip-build --no-promote"

  [tasks.lint]
  depends = [ "sync" ]
  run = "tsc --noEmit"

  [tasks.fix]
  depends = [ "sync" ]
  run = "prisma format"

  # TODO disabled until GA
  #[tasks.publish]
  #run = "npm publish --access public --non-interactive"

  [tasks.sync]
  run = [{ tasks = [ "sync:*" ]}]

  [tasks."sync:typegen"]
  description = "Generate type definitions for the Next.js APIs and routes"
  run = "vinext typegen"

  [tasks.setup]
  run = [{ tasks = [ "setup:*" ]}]
  depends_post = "sync"

[env]
_.path = "./node_modules/.bin"
