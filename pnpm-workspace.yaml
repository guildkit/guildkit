packages:
  - "projects/*"
allowBuilds:
  "@nestjs/core": true
  "@openapitools/openapi-generator-cli": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 4320 # 72 hours
minimumReleaseAgeExcludePrune: true
verifyDepsBeforeRun: warn # for `clean` & `refresh`
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.3.4
  - vite@8.3.4
