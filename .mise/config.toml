#:schema https://mise.jdx.dev/schema/mise.json

monorepo_root = true

[monorepo]
config_roots = [ "projects/*" ]

[tools]
node = { version = "24", corepack = true }

[hooks]
postinstall = [
  "corepack enable",
  "pnpm install --frozen-lockfile",
  { task = "setup" },
]

[env]
_.file = ".env"
_.path = "./node_modules/.bin"

[settings]
jobs = 8
