name: "Deployment (preview)"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      SERVER_ENV: preview

      BETTER_AUTH_URL: "https://demo.guildkit.net"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      GOOGLE_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GOOGLE_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
    steps:
      - name: Remove Podman which does not work well on GitHub Actions
        run: sudo apt-get remove -y podman

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true

      - run: mise run build

      - name: "[preview] Upload Cloudflare Worker version"
        id: deployment
        run: |
          mise run upload | tee upload.log
          echo "url=$(grep -oE 'Version URL: \S+' upload.log | sed 's/^Version URL: //')" >> "$GITHUB_OUTPUT"

      - name: "[preview] Add comment for deployment URL"
        run: |
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none --body "Deployed to preview:
          ${{ steps.deployment.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
