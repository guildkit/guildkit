name: "Demo deployment (production)"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      SERVER_ENV: demo-production

      BETTER_AUTH_URL: "https://demo.guildkit.net"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      GOOGLE_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GOOGLE_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
    steps:
      - name: Remove Podman which does not work well on GitHub Actions
        run: sudo apt-get remove -y podman

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true

      - run: pnpm run build

      - name: "Deploy Cloudflare Worker Production"
        run: pnpm run deploy
