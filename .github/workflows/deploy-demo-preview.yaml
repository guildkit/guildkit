name: "Demo deployment (preview)"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      SERVER_ENV: demo-preview

      # Build the app as a Cloudflare Worker Preview. `cf previews deploy --prebuilt` requires it,
      # and cloudflare.config.ts reads it (`isPreview`) to embed SERVER_ENV=preview.
      CLOUDFLARE_PREVIEW_BUILD: "true"

      BETTER_AUTH_URL: "https://demo.guildkit.net"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      GOOGLE_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GOOGLE_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_ID: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
      GITHUB_CLIENT_SECRET: DUMMY_CREDENTIAL_REPLACE_ME_ON_PRODUCTION
    steps:
      - name: Remove Podman which does not work well on GitHub Actions
        run: sudo apt-get remove -y podman

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Neon branch has to be ready before `pnpm run deploy-preview`
      # since it runs `prisma migrate deploy` and seeding.
      - name: "Create Neon Branch"
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          username: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: "Reset Neon Branch"
        id: reset_neon_branch
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1.3.2
        with:
          parent: true
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          cs_role_name: neondb_owner
          cs_database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: "Set DATABASE_URL"
        env:
          DATABASE_URL: ${{ steps.reset_neon_branch.outputs.db_url }}
        run: echo "DATABASE_URL=${DATABASE_URL}" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - run: pnpm run build

      # See scripts/deploy-preview.nu in projects/guildkit
      - name: "Deploy Cloudflare Worker Preview"
        run: pnpm run deploy-preview
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
